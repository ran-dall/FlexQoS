name: Strict TC audit

on:
  push:
    branches: [chatgpt-tc-audit]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply TC fix and harness correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test-tc.bats')
          text = test_path.read_text()
          old = '    flexqos_qdisc) printf \'%s\\n\' "$SETTINGS_QDISC" ;;'
          new = '    *_qdisc) printf \'%s\\n\' "$SETTINGS_QDISC" ;;'
          if text.count(old) != 1:
              raise SystemExit(f'test mock anchor count: {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1))

          script_path = Path('flexqos.sh')
          text = script_path.read_text()
          old = '''\t# If the calculated burst is less than ASUS' minimum value of 3200, use 3200
          \t# to avoid problems with child and leaf classes outside of FlexQoS scope that use 3200.
          \tif [ "${BURST}" -lt 3200 ]; then
          \t\tif [ "${QDISC:-1}" = "0" ]; then
          \t\t\tBURST=3200
          \t\telse
          \t\t\tBURST="${MIN_PACKET}"
          \t\tfi
          \tfi
          '''
          new = '''\t# Keep ASUS qdiscs at their 3200-byte floor. For fq_codel, never emit a
          \t# cburst below the cached MTU/ATM-derived minimum packet size.
          \tif [ "${QDISC:-1}" = "0" ]; then
          \t\tif [ "${BURST}" -lt 3200 ]; then
          \t\t\tBURST=3200
          \t\tfi
          \telif [ "${BURST}" -lt "${MIN_PACKET}" ]; then
          \t\tBURST="${MIN_PACKET}"
          \tfi
          '''
          if text.count(old) != 1:
              raise SystemExit(f'get_cburst anchor count: {text.count(old)}')
          script_path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate whitespace
        run: git diff --check 7e8de159d53be358c35ba107fa1d5cea3cc909ca

      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install WebUI lint tool
        run: npm install --global eslint@latest

      - name: ShellCheck production script
        run: shellcheck -s sh flexqos.sh

      - name: Lint WebUI
        run: .mise/tasks/lint-webui
        env:
          MISE_PROJECT_ROOT: ${{ github.workspace }}

      - name: Run firewall regression suite
        run: bats tests/test-iptables-rules.bats

      - name: Run scheduler regression suite
        run: bats tests/test-schedule.bats

      - name: Run TC regression suite
        run: bats tests/test-tc.bats

      - name: Run WebUI regression suite
        run: .mise/tasks/test-webui
        env:
          MISE_PROJECT_ROOT: ${{ github.workspace }}

      - name: Verify action syntax
        run: |
          mkdir -p /tmp/actionlint
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp/actionlint
          /tmp/actionlint/actionlint .github/workflows/*.yml

      - name: Create final TC commit
        run: |
          rm -f .github/workflows/tmp-tc-audit.yml
          git config user.name "Randall"
          git config user.email "17261190+ran-dall@users.noreply.github.com"
          git reset --soft 7e8de159d53be358c35ba107fa1d5cea3cc909ca
          git add -A
          git commit -m "fix(tc): harden traffic-control generation" -m "Add strict Bats coverage for qdisc selection, MTU/ATM minima, burst/cburst/quantum calculations, exact HTB/static-filter serialization, deterministic class-rate generation, and automatic-bandwidth behavior. Enforce the fq_codel cburst floor for jumbo MTUs."
          git push origin HEAD:develop
