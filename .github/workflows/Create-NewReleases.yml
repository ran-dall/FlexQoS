name: Auto Tag and Release on PR Merge

on:
  pull_request:
    branches:
      - 'master'
    types:
      - closed

permissions:
  contents: write

jobs:
  tag-and-release:
    # Run only when the PR came from the develop branch and was merged
    if: github.event.pull_request.merged == true && github.head_ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      # 1--- Check out master so we tag the exact merge commit
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: 'master'
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # 2--- Identify the version in flexqos.sh and expose it as an output
      - name: Determine Version Tag from flexqos.sh
        id: nextver
        shell: bash
        run: |
          VERSION="$(sed -nE \
            's/^version="?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/p' \
            flexqos.sh | head -n 1)"

          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine FlexQoS version from flexqos.sh" >&2
            exit 1
          fi

          VERSION="v$VERSION"

          echo "Using version tag $VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      # 3--- Create and push the tag taken from Script.sh
      - name: Create and Push Tag
        run: |
          TAG="${{ steps.nextver.outputs.tag }}"
          # Skip if the tag already exists (avoids fatal push error)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists – skipping creation"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # 4--- Publish a GitHub Release with auto-generated notes
      - name: Create Release with Automated Release Notes
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.nextver.outputs.tag }}
          name: "Release ${{ steps.nextver.outputs.tag }}"
          prerelease: false
          generate_release_notes: true
