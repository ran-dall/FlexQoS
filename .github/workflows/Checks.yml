name: Project checks

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Install mise toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          minimum_release_age: 7d

      - name: Run project checks
        run: mise run check
